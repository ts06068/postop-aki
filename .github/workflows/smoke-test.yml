name: smoke-test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Install dependencies
        run: Rscript scripts/install_dependencies.R
      - name: Run tests
        run: Rscript tests/test_pipeline.R
      # Actions sees sample.xlsx only. Never upload the protected extract.
      - name: Run sample analysis
        run: Rscript run_all.R --mode=sample
